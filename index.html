<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daik Media - Secure Data Services</title>
    <meta name="description" content="Secure data packages for MTN, Vodafone, and AirtelTigo. Login required for access.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .redirect-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 60px 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .redirect-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            color: white;
            font-size: 32px;
        }

        .redirect-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .redirect-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .redirect-message {
            font-size: 14px;
            color: #888;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .redirect-btn {
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .redirect-btn:hover {
            transform: translateY(-2px);
        }

        .auto-redirect {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="redirect-title">Daik Media</h1>
        <p class="redirect-subtitle">Secure Data Services</p>
        <p class="redirect-message">This is a secure platform. You must login to access our services.</p>
        <a href="login.html" class="redirect-btn">
            <i class="fas fa-sign-in-alt"></i> Go to Login
        </a>
        <p class="auto-redirect">Redirecting automatically in <span id="countdown">5</span> seconds...</p>
    </div>

    <script>
        // Simple countdown and auto-redirect
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = 'login.html';
            }
        }, 1000);
    </script>
</body>
</html>
